[project]
name = "mapsleads"
version = "0.1.0"
description = "Prototype: find businesses without a website (OpenStreetMap + Google Places verification)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "requests>=2.31",
    "typer>=0.12",
    "openpyxl>=3.1.5",
]

[project.scripts]
mapsleads = "mapsleads.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapsleads"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
